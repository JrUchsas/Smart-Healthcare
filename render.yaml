services:
  - type: web
    name: smart-healthcare-web
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Smart Healthcare"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: smart-healthcare-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: smart-healthcare-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: SEED_ON_DEPLOY
        value: "true"

databases:
  - name: smart-healthcare-db
    databaseName: smart_healthcare
    user: smart_healthcare_user
    plan: free
    region: oregon
